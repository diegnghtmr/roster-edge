name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test -- --run
        env:
          NODE_OPTIONS: --no-experimental-webstorage
      - run: npm run build
        env:
          VITE_BACKEND_URL: http://127.0.0.1:8074/api
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 1

  backend-and-smoke:
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_PORT: '5432'
      POSTGRES_DB: rosteredge_smoke
      POSTGRES_USER: roster_ci
      POSTGRES_PASSWORD: roster_ci_only
      SPRING_PROFILES_ACTIVE: test
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_JDBC_CORE: WARN
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: rosteredge_smoke
          POSTGRES_USER: roster_ci
          POSTGRES_PASSWORD: roster_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roster_ci -d rosteredge_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: ./mvnw -B verify
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Install pinned Playwright and Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/roster-playwright" --ignore-scripts --no-audit --no-fund playwright@1.61.0
          "$RUNNER_TEMP/roster-playwright/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run browser smoke against packaged backend
        run: PW="$RUNNER_TEMP/roster-playwright/node_modules/playwright" node docs/testing/smoke.cjs
